[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swin-classifier"
version = "1.0.0"
description = "Image classification with Swin Transformer, arranged as ports and adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Igors Volohovs", email = "igorsvolohovs@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "transformers>=4.40",
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=10.0",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "radon>=6.0",
    "pre-commit>=3.7",
]
release = ["pyinstaller>=6.0"]

[project.scripts]
swin-classify = "swin_classifier.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
# Vendored agent tooling and generated API docs are not this project's code.
extend-exclude = [".agent", "docs/api", "workflow_prompts", "scratch"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "C90"]
"scripts/*" = ["S404", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
# The transformers and torch stubs are incomplete; do not fail on their gaps.
[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "torchvision.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 95% once the use case, the loader and the shell were covered.
# The floor sits just below that so a real regression fails the build.
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
